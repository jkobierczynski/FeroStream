[package]
name = "ferostream-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ferostream-proto = { path = "../crates/proto" }
ferostream-client = { path = "../crates/client" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "client_decoder"
path = "fuzz_targets/client_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "window_properties"
path = "fuzz_targets/window_properties.rs"
test = false
doc = false
bench = false

[workspace]

[profile.release]
debug = 1
overflow-checks = true
