# The agent is a static Linux binary. Link it with rust-lld, which comes
# with Rust, so it builds the same way on Linux, macOS and Windows without
# a C toolchain for the target: every dependency of the agent is pure Rust.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
