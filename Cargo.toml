[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jkobierczynski/ferostream"

[workspace.dependencies]
ferostream-proto = { path = "crates/proto", version = "0.1.0" }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
lz4_flex = { version = "0.14", default-features = false, features = ["safe-encode", "safe-decode", "std"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
