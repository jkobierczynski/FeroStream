name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml and installs the pinned toolchain.
      - run: rustup show active-toolchain
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p ferostream-client
      - name: Report exe size
        shell: pwsh
        run: |
          $size = (Get-Item target/release/ferostream.exe).Length
          "ferostream.exe: $([math]::Round($size / 1KB)) KB" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: ferostream-exe
          path: target/release/ferostream.exe
      # The agents build on Windows too, with no WSL or C toolchain:
      # .cargo/config.toml links them with rust-lld. This keeps the
      # instructions in the README true.
      - name: Build the Linux agents on Windows
        run: |
          rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          cargo build --release --locked -p ferostream-agent --target x86_64-unknown-linux-musl
          cargo build --release --locked -p ferostream-agent --target aarch64-unknown-linux-musl

  linux:
    name: Agent against Xvfb (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain
      - run: sudo apt-get update && sudo apt-get install -y xvfb xterm
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The xterm test must run here, not skip.
      - run: cargo test --workspace --locked
        env:
          FEROSTREAM_REQUIRE_X: "1"
      # One static binary that runs on any x86-64 Linux, and one for 64-bit
      # ARM (Raspberry Pi OS, Graviton). rust-lld links both (see
      # .cargo/config.toml): no C toolchain for the target needed.
      - run: rustup target add x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - run: cargo build --release --locked -p ferostream-agent --target x86_64-unknown-linux-musl
      - run: cargo build --release --locked -p ferostream-agent --target aarch64-unknown-linux-musl
      # Named as the client looks for them next to its exe: plain for
      # x86-64, with `uname -m` appended for other machines.
      - name: Collect and report the agents
        run: |
          mkdir agents
          cp target/x86_64-unknown-linux-musl/release/ferostream-agent agents/ferostream-agent
          cp target/aarch64-unknown-linux-musl/release/ferostream-agent agents/ferostream-agent-aarch64
          for f in agents/*; do
            echo "$(basename "$f") (static, musl): $(( $(stat -c %s "$f") / 1024 )) KB" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ferostream-agents
          path: agents

  # The exe and the agents it copies to hosts, in one download.
  package:
    name: Windows package
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ferostream-exe
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: ferostream-agents
          path: package
      - run: ls -l package
      - uses: actions/upload-artifact@v4
        with:
          name: ferostream-windows-x64
          path: package

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  fuzz:
    name: Fuzz smoke run
    runs-on: ubuntu-latest
    # Same pinned nightly as FeroSSH.
    env:
      FUZZ_TOOLCHAIN: nightly-2026-10-31
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Inputs that once crashed a target start its corpus.
      - run: mkdir -p fuzz/corpus && cp -r fuzz/regressions/. fuzz/corpus/
      - run: |
          for target in frame_decode client_decoder window_properties tile_pack clipboard_pieces; do
            mkdir -p "fuzz/corpus/$target"
            cargo "+$FUZZ_TOOLCHAIN" fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_total_time=60
          done
